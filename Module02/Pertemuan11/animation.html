<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>

        * {
            padding: 0;
            margin: 0;
        }
        .box {
            width: 200px;
            height: 200px;
            background-color: cadetblue;

            transform: translate(100px, 100px);

        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
