<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        body{
            background-color: #F2EAE2;
            margin-left: auto;
            margin-right: auto;
            margin-top: 20%;
        }
        .card{
            width:343px;
            height:611px;
            border-radius: 16px;

            margin-left: auto;
            margin-right: auto;
            margin-top: 5%;

            border: 1px solid grey
        }

        .card .img{
            height: 240px;
            background-image: url('./parfume.png');
            border-radius: 16px 16px 0 0;
        }

        .card .desc p.top-title{
            padding: 16px 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="img"></div>
        <div class="desc"></div>
            <p> class='top-title'</p>

    </div>
    
</body>
</html>
